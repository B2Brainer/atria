name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .

  desktop:
    name: Desktop (Node 24 LTS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
