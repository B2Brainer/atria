[project]
name = "atria"
version = "0.1.0"
description = "Capa entre el usuario y las capacidades de IA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: llamada real a un proveedor externo; requiere `codex` instalado y autenticado",
    "db: requiere PostgreSQL en ATRIA_TEST_DATABASE_URL (ver README)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
