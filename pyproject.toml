[project]
name = "atria"
version = "0.1.0"
description = "Capa entre el usuario y las capacidades de IA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.26.0",
    "pydantic>=2.13.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: llamada real a un proveedor externo; requiere red y credenciales",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
