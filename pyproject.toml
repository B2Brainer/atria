[project]
name = "atria"
version = "0.1.0"
description = "Atria — a software layer between the user and AI capabilities."
requires-python = "==3.13.*"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pyobjc-framework-Security>=10.3,<12; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
    "hatchling>=1.25,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["core", "adapters", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["core", "adapters", "api"]
